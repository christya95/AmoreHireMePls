[project]
name = "amorehiremepls"
version = "0.1.0"
description = "Local job-search assistant: discovery, grounded resume tailoring, authorized application execution, tracker sync, recruiter outreach."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Joss Christyanton" }]
dependencies = [
  "fastapi>=0.162.0,<0.163",
  "uvicorn[standard]>=0.54.0,<0.55",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20",
  "itsdangerous>=2.2.0,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.16.2,<3",
  "pymongo>=4.19.0,<5",
  "langchain>=1.4.8,<2",
  "langchain-core>=1.7.4,<2",
  "langchain-openai>=1.7.3,<2",
  "langchain-anthropic>=1.7.9,<2",
  "langgraph>=1.2.19,<2",
  "langgraph-checkpoint-mongodb>=0.5.1,<0.6",
  "playwright>=1.64.1,<1.65",
  "python-docx>=1.2.0,<2",
  "pypdf>=6.21.4,<7",
  "httpx>=0.28.1,<0.29",
  "apscheduler>=3.11.3,<4",
  "tzdata>=2024.1",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "ruff>=0.14",
]

[project.scripts]
amore = "amorehiremepls.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amorehiremepls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -p no:cacheprovider"
markers = [
  "mongo: requires the local dev MongoDB container (AMORE_TEST_MONGODB_URI)",
  "browser: requires Playwright Chromium installed",
]

[tool.ruff]
line-length = 180
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer.Option/Argument defaults are the documented pattern; E701/E702: compact guard clauses.
ignore = ["B008", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# embedded HTML/JS fixture strings
"tests/fixtures/*" = ["E501"]
