{% from "_brand.html" import mark %}{% if avatar_url %}<span class="avatar {{ size or '' }}"><img src="{{ avatar_url }}" alt="{{ display_name }}"></span>{% elif ui.avatar.style == 'mark' or initials == '?' %}<span class="avatar {{ size or '' }} style-mark" aria-label="{{ display_name }}">{{ mark(cls='logo-sm' if size == 'sm' else '') }}</span>{% else %}<span class="avatar {{ size or '' }} style-{{ ui.avatar.style }}" aria-label="{{ display_name }}">{{ initials }}</span>{% endif %}
